<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TBS SIGNAL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06090f">
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  body{background:#06090f; color:#e0e0e0; font-family:'Segoe UI',sans-serif; padding:12px;}
  .card{background:#0f172a; border:1px solid #1e293b; border-radius:16px; padding:14px; margin-bottom:12px;}
  .header{display:flex; align-items:center; justify-content:space-between;}
  .logo-icon{width:45px; height:45px; background:linear-gradient(135deg,#00ffb8,#00a3ff); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px;}
  .badge{background:#00e676; color:#000; padding:3px 8px; border-radius:6px; font-size:10px; font-weight:bold;}
  .online{color:#00e676; display:flex; align-items:center; gap:5px; font-size:12px;}
  .dot{width:8px; height:8px; background:#00e676; border-radius:50%; animation:pulse 1.5s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,230,118,0.7)} 100%{box-shadow:0 0 0 10px rgba(0,230,118,0)}}
  select{width:100%; background:#1e293b; color:#fff; border:1px solid #334155; padding:12px; border-radius:10px; margin-top:10px; outline:none; font-size:14px;}
  #tradingview_chart{height:420px; border-radius:12px; margin-top:10px; overflow:hidden;} /* Chart বড় করে দিলাম */
  .info{font-size:11px; color:#64748b; text-align:center; margin-top:10px;}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="logo-icon">🛡️</div>
      <div><div style="font-weight:bold; font-size:16px;">TBS SIGNAL <span class="badge">PRO</span></div><div style="font-size:11px; color:#94a3b8;">100+ Markets Live Terminal</div></div>
    </div>
    <div class="online"><div class="dot"></div> LIVE</div>
  </div>
</div>

<div class="card">
  <div style="font-size:12px; color:#94a3b8;">🔍 SELECT MARKET - 100+ PAIRS</div>
  <select id="pairSelect" onchange="changePair()">
    <!-- FOREX -->
    <option value="OANDA:EURUSD">EUR/USD</option><option value="OANDA:GBPUSD">GBP/USD</option><option value="OANDA:USDJPY">USD/JPY</option><option value="OANDA:AUDUSD">AUD/USD</option>
    <option value="OANDA:USDCAD">USD/CAD</option><option value="OANDA:USDCHF">USD/CHF</option><option value="OANDA:NZDUSD">NZD/USD</option><option value="OANDA:EURGBP">EUR/GBP</option>
    <option value="OANDA:EURJPY">EUR/JPY</option><option value="OANDA:GBPJPY">GBP/JPY</option>
    <!-- CRYPTO -->
    <option value="BINANCE:BTCUSDT">BTC/USD</option><option value="BINANCE:ETHUSDT">ETH/USD</option><option value="BINANCE:BNBUSDT">BNB/USD</option><option value="BINANCE:SOLUSDT">SOL/USD</option>
    <option value="BINANCE:XRPUSDT">XRP/USD</option><option value="BINANCE:DOGEUSDT">DOGE/USD</option><option value="BINANCE:ADAUSDT">ADA/USD</option><option value="BINANCE:TRXUSDT">TRX/USD</option>
    <option value="BINANCE:MATICUSDT">MATIC/USD</option><option value="BINANCE:LTCUSDT">LTC/USD</option>
    <!-- STOCKS -->
    <option value="NASDAQ:AAPL">APPLE</option><option value="NASDAQ:TSLA">TESLA</option><option value="NASDAQ:NVDA">NVIDIA</option><option value="NASDAQ:MSFT">MICROSOFT</option>
    <option value="NYSE:GOOGL">GOOGLE</option><option value="NYSE:AMZN">AMAZON</option><option value="NYSE:META">META</option>
    <!-- INDICES & COMMODITIES -->
    <option value="OANDA:SPX500USD">S&P 500</option><option value="OANDA:NAS100USD">NASDAQ</option><option value="OANDA:XAUUSD">GOLD</option><option value="OANDA:XAGUSD">SILVER</option>
  </select>
</div>

<div class="card">
  <div style="font-size:12px; color:#94a3b8; margin-bottom:8px;">📈 LIVE TRADINGVIEW CHART</div>
  <div id="tradingview_chart"></div>
</div>

<div class="info">⚠️ This is a Market Analysis Terminal. No signals provided. Trade at your own risk.</div>

<script>
// TradingView Chart Load
function loadChart(symbol){
  document.getElementById('tradingview_chart').innerHTML = "";
  new TradingView.widget({
    "autosize": true, 
    "height": 420, 
    "symbol": symbol, 
    "interval": "1", // 1 Minute
    "timezone": "Asia/Dhaka", 
    "theme": "dark", 
    "style": "1", // Candlestick
    "hide_side_toolbar": false,
    "withdateranges": true,
    "container_id": "tradingview_chart", 
    "allow_symbol_change": true,
    "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies"] // RSI + Moving Average Add করা আছে
  });
}
loadChart("OANDA:EURUSD");

// Pair Change
function changePair(){
  let pair = document.getElementById('pairSelect').value;
  loadChart(pair);
}
</script>
</body>
</html>
