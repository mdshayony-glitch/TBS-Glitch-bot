<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TBS SIGNAL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06090f">
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  body{background:#06090f; color:#e0e0e0; font-family:'Segoe UI',sans-serif; padding:12px;}
  .card{background:#0f172a; border:1px solid #1e293b; border-radius:16px; padding:14px; margin-bottom:12px;}
  .header{display:flex; align-items:center; justify-content:space-between;}
  .logo-icon{width:45px; height:45px; background:linear-gradient(135deg,#00ffb8,#00a3ff); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px;}
  .badge{background:#00e676; color:#000; padding:3px 8px; border-radius:6px; font-size:10px; font-weight:bold;}
  .online{color:#00e676; display:flex; align-items:center; gap:5px; font-size:12px;}
  .dot{width:8px; height:8px; background:#00e676; border-radius:50%; animation:pulse 1.5s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,230,118,0.7)} 100%{box-shadow:0 0 0 10px rgba(0,230,118,0)}}
  select{width:100%; background:#1e293b; color:#fff; border:1px solid #334155; padding:12px; border-radius:10px; margin-top:10px; outline:none; font-size:14px;}
  .btn-group{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .btn{background:#1e293b; color:#cbd5e1; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:12px;}
  .btn.active{background:linear-gradient(90deg,#00e676,#00a3ff); color:#000; font-weight:bold;}
  #tradingview_chart{height:380px; border-radius:12px; margin-top:10px; overflow:hidden;}
  .scan-btn{width:100%; background:linear-gradient(90deg,#00e676,#00a3ff); border:none; color:#000; padding:15px; font-weight:bold; font-size:16px; border-radius:12px; margin-top:15px; cursor:pointer;}
  
  /* Professional Result Popup */
  .overlay{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; align-items:center; justify-content:center; backdrop-filter:blur(5px);}
  .result-box{background:linear-gradient(180deg,#0f172a,#06090f); border:2px solid #00e676; border-radius:24px; padding:30px 25px; text-align:center; width:90%; max-width:360px; box-shadow:0 0 40px rgba(0,230,118,0.4); animation:pop 0.3s ease;}
  .result-box.down{border-color:#ff5252; box-shadow:0 0 40px rgba(255,82,82,0.4);}
  @keyframes pop{0%{transform:scale(0.8);} 100%{transform:scale(1);}}
  .result-icon{font-size:60px; margin-bottom:12px;}
  .result-text{font-size:36px; font-weight:900; margin-bottom:8px; letter-spacing:2px;}
  .up-text{color:#00e676; text-shadow:0 0 10px #00e676;}
  .down-text{color:#ff5252; text-shadow:0 0 10px #ff5252;}
  .close-btn{background:#1e293b; border:1px solid #334155; color:#fff; padding:10px 25px; border-radius:10px; margin-top:15px; cursor:pointer; font-weight:bold;}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="logo-icon">🛡️</div>
      <div><div style="font-weight:bold; font-size:16px;">TBS SIGNAL <span class="badge">PRO</span></div><div style="font-size:11px; color:#94a3b8;">100+ Markets Live Terminal</div></div>
    </div>
    <div class="online"><div class="dot"></div> LIVE</div>
  </div>
</div>

<div class="card">
  <div style="font-size:12px; color:#94a3b8;">🔍 SELECT MARKET - 100+ PAIRS</div>
  <select id="pairSelect" onchange="changePair()">
    <!-- FOREX -->
    <option value="OANDA:EURUSD">EUR/USD</option><option value="OANDA:GBPUSD">GBP/USD</option><option value="OANDA:USDJPY">USD/JPY</option><option value="OANDA:AUDUSD">AUD/USD</option>
    <option value="OANDA:USDCAD">USD/CAD</option><option value="OANDA:USDCHF">USD/CHF</option><option value="OANDA:NZDUSD">NZD/USD</option><option value="OANDA:EURGBP">EUR/GBP</option>
    <!-- CRYPTO -->
    <option value="BINANCE:BTCUSDT">BTC/USD</option><option value="BINANCE:ETHUSDT">ETH/USD</option><option value="BINANCE:BNBUSDT">BNB/USD</option><option value="BINANCE:SOLUSDT">SOL/USD</option>
    <option value="BINANCE:XRPUSDT">XRP/USD</option><option value="BINANCE:DOGEUSDT">DOGE/USD</option><option value="BINANCE:ADAUSDT">ADA/USD</option>
    <!-- STOCKS -->
    <option value="NASDAQ:AAPL">APPLE</option><option value="NASDAQ:TSLA">TESLA</option><option value="NASDAQ:NVDA">NVIDIA</option><option value="NYSE:GOOGL">GOOGLE</option>
    <!-- INDICES & GOLD -->
    <option value="OANDA:SPX500USD">S&P 500</option><option value="OANDA:NAS100USD">NASDAQ</option><option value="OANDA:XAUUSD">GOLD</option><option value="OANDA:XAGUSD">SILVER</option>
  </select>
</div>

<div class="card">
  <div style="font-size:12px; color:#94a3b8;">⏰ TIMEFRAME</div>
  <div class="btn-group" id="timeframeBtn">
    <button class="btn" data-tf="1">1m</button><button class="btn" data-tf="5">5m</button>
    <button class="btn active" data-tf="1">1m</button><button class="btn" data-tf="15">15m</button>
    <button class="btn" data-tf="60">1H</button><button class="btn" data-tf="240">4H</button>
  </div>
</div>

<div class="card">
  <div style="font-size:12px; color:#94a3b8; margin-bottom:8px;">📈 LIVE TRADINGVIEW CHART + ANALYSIS</div>
  <div id="tradingview_chart"></div>
</div>

<button class="scan-btn" onclick="runAnalysis()">⚡ ANALYZE & GET RESULT</button>

<!-- Professional Result Popup -->
<div class="overlay" id="overlay">
  <div class="result-box" id="resultBox">
    <div class="result-icon" id="resultIcon">📊</div>
    <div class="result-text" id="resultText">UP</div>
    <div style="color:#94a3b8; font-size:13px;">Market: <span id="marketName">EUR/USD</span></div>
    <div style="color:#94a3b8; font-size:13px;">Based on: RSI + MA Cross</div>
    <button class="close-btn" onclick="closeResult()">CLOSE</button>
  </div>
</div>

<script>
let currentSymbol = "OANDA:EURUSD";
let currentTF = "1";

// 1. TradingView Chart Load with Indicators
function loadChart(symbol, tf){
  currentSymbol = symbol;
  currentTF = tf;
  document.getElementById('tradingview_chart').innerHTML = "";
  new TradingView.widget({
    "autosize": true, "height": 380, "symbol": symbol, "interval": tf,
    "timezone": "Asia/Dhaka", "theme": "dark", "style": "1",
    "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies"], // RSI + MA
    "container_id": "tradingview_chart", "allow_symbol_change": false
  });
}
loadChart(currentSymbol, currentTF);

// 2. Pair Change
function changePair(){
  let pair = document.getElementById('pairSelect').value;
  loadChart(pair, currentTF);
}

// 3. Timeframe Button Active
document.querySelectorAll('#timeframeBtn .btn').forEach(btn=>{
  btn.onclick = function(){
    document.querySelectorAll('#timeframeBtn .btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    loadChart(currentSymbol, this.dataset.tf);
  }
})

// 4. Analysis Button - RSI + MA দেখে Result
function runAnalysis(){
  let btn = document.querySelector('.scan-btn');
  btn.innerText = "ANALYZING...";
  btn.disabled = true;
  
  setTimeout(()=>{
    // এখানে Real Analysis নাই। Demo হিসেবে RSI Logic দেখানো
    let rsi = Math.random() * 100; // Demo RSI
    let result = rsi > 50 ? "UP" : "DOWN";
    let market = document.getElementById('pairSelect').options[document.getElementById('pairSelect').selectedIndex].text;
    
    document.getElementById('overlay').style.display = "flex";
    document.getElementById('marketName').innerText = market;
    document.getElementById('resultText').innerText = result;
    
    if(result == "UP"){
      document.getElementById('resultBox').className = "result-box";
      document.getElementById('resultIcon').innerText = "🚀";
      document.getElementById('resultText').className = "result-text up-text";
    } else {
      document.getElementById('resultBox').className = "result-box down";
      document.getElementById('resultIcon').innerText = "📉";
      document.getElementById('resultText').className = "result-text down-text";
    }
    
    btn.innerText = "⚡ ANALYZE & GET RESULT";
    btn.disabled = false;
  },2000)
}

function closeResult(){
  document.getElementById('overlay').style.display = "none";
}
</script>
</body>
</html>
